name: Deploy to your Cloudflare account
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carreg-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run hosting:configure
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.selfhost.json
      - name: Publish website
        run: npx wrangler deploy --config dist/server/wrangler.selfhost.json
